name: Release

# Tagging `v0.2.0` builds the Windows installer, signs the updater artifacts,
# and publishes them as a GitHub release. The running app finds them through
# `latest.json` at the endpoint in `apps/desktop/src-tauri/tauri.conf.json`.
#
# Two repository secrets must exist for this to sign anything:
#
#   TAURI_SIGNING_PRIVATE_KEY           the contents of the private key file
#                                       generated by `tauri signer generate`
#                                       (kept outside this repo, under
#                                       %USERPROFILE%\.tauri\)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password — empty string, since the
#                                       key was generated without one
#
# The `plugins.updater.pubkey` in tauri.conf.json is the public half of that
# same key. If they ever stop matching, every installed copy of Essay rejects
# the update as unsigned and says nothing about why — so rotate both together
# or not at all.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: windows installer + updater artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the app version
        shell: bash
        # The updater compares the version in `latest.json` — which comes from
        # tauri.conf.json, not from the tag — against the version each
        # installed copy is running. Tagging v0.2.0 without bumping the config
        # publishes an update that no one is ever offered, silently.
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundler builds an installer but no signature,
          # and `latest.json` is written with an empty one that no client
          # will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Essay ${{ github.ref_name }}
          releaseBody: 'Download the installer below. Existing installations update themselves.'
          # Published, not drafted: the updater reads
          # `releases/latest/download/latest.json`, and a draft release is not
          # `latest` to anyone but the maintainer.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
