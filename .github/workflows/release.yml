name: Release

# Tagging `v0.2.0` builds an installer on each desktop platform, signs the
# updater artifacts, and publishes them all as one GitHub release. The running
# app finds them through `latest.json` at the endpoint in
# `apps/desktop/src-tauri/tauri.conf.json`.
#
# Two repository secrets must exist for this to sign anything:
#
#   TAURI_SIGNING_PRIVATE_KEY           the contents of the private key file
#                                       generated by `tauri signer generate`
#                                       (kept outside this repo, under
#                                       %USERPROFILE%\.tauri\)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password — empty string, since the
#                                       key was generated without one
#
# The `plugins.updater.pubkey` in tauri.conf.json is the public half of that
# same key. If they ever stop matching, every installed copy of Essay rejects
# the update as unsigned and says nothing about why — so rotate both together
# or not at all.
#
# That key is Essay's own update signature and is all the updater checks. It is
# not an Apple Developer ID: there are no Apple secrets here, so the macOS
# artifacts are unsigned and unnotarised, and a first launch needs the
# right-click → Open dance. Auto-updates after that are unaffected.
#
# Shape of the run, and why it is four jobs rather than two:
#
#   guard   → draft → bundle (×3, in parallel) → publish
#
# `draft` creates the empty draft release up front so the three platform jobs
# have something to upload into. They would otherwise race to create it, which
# is the price of running them at the same time — and running them at the same
# time is worth paying for. Measured on v0.1.2, which was serial: Windows 26m,
# then macOS 32m, then Linux 15m, 74 minutes end to end for 32 minutes of work.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    name: tag matches app version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        # The updater compares the version in `latest.json` — which comes from
        # tauri.conf.json, not from the tag — against the version each
        # installed copy is running. Tagging v0.2.0 without bumping the config
        # publishes an update that no one is ever offered, silently. Its own
        # job so a mismatch costs seconds rather than three platform builds.
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP"
            exit 1
          fi

  draft:
    name: open the draft release
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or reuse the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Created here, before the matrix, because three parallel jobs that
        # each create-the-release-if-absent is a race with no good outcome:
        # either two of them 422 or the release exists twice. With the id
        # handed down, tauri-action uploads into an existing release and never
        # reaches for the create path at all.
        #
        # Idempotent on purpose. A tag whose Windows leg failed gets re-run,
        # and the second run must find the same draft rather than trip over
        # the assets the first one already uploaded.
        #
        # Drafted rather than published: the updater reads
        # `releases/latest/download/latest.json`, so a release that is public
        # before every platform has finished is one that offers an update to
        # operating systems it does not yet list. A draft is invisible to the
        # updater, which is what is wanted until the `publish` job says so.
        run: |
          set -eu
          TAG="$GITHUB_REF_NAME"
          ID=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            echo "reusing existing release $ID for $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --title "Essay $TAG" \
              --notes "$(cat .github/release-notes.md)"
            ID=$(gh api "repos/$GH_REPO/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
            echo "created release $ID for $TAG"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.label }}
    needs: draft
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing should not cancel installers that already built:
      # the draft release keeps whatever landed, and the tag can be re-run.
      fail-fast: false
      # Parallel. This used to be `max-parallel: 1`, because each run of
      # tauri-action built `latest.json` by downloading the release's existing
      # copy, merging its own platform in and re-uploading — a read-modify-
      # write that loses a platform's entry when two jobs finish together, and
      # a missing entry is not an error anywhere, just an OS that quietly
      # stops being offered updates. `includeUpdaterJson: false` below removes
      # that write entirely; the `publish` job composes the whole manifest
      # once, from the signatures, when every platform is done. One writer, so
      # there is nothing left to serialise.
      matrix:
        include:
          - platform: windows-latest
            label: windows (nsis installer)
            args: ''
            rust-targets: ''
          # One universal binary rather than two builds: it covers Apple
          # Silicon and Intel, and one artifact serves both darwin-aarch64 and
          # darwin-x86_64 in the manifest. It is also the long pole of the
          # whole workflow — 31 minutes of the 32 this run now takes — because
          # it compiles the entire dependency graph once per architecture on
          # the smallest runner GitHub offers.
          - platform: macos-latest
            label: macos (universal .app + .dmg)
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Pinned, not `ubuntu-latest`. The build host sets the glibc floor of
          # everything it produces, so letting GitHub move the image moves the
          # oldest distro Essay runs on without anyone deciding to. 24.04 is the
          # oldest image still supported through 2026 that ships
          # libwebkit2gtk-4.1.
          - platform: ubuntu-24.04
            label: linux (deb + appimage)
            args: ''
            rust-targets: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Both of these are about *whose* cache this is, and the answer is
          # never this run's own.
          #
          # GitHub scopes a cache to the ref that wrote it and lets a run
          # restore only from its own ref or from the default branch. A run on
          # `refs/tags/v0.1.2` therefore writes a cache that `refs/tags/v0.1.3`
          # can never see. Measured after v0.1.2: 2.82 GB of cargo artifacts
          # saved under the tag, unreachable by every release that will ever
          # follow it, while all three platform jobs logged "No cache found"
          # and compiled Typst from nothing — 24m42s on Windows, 31m15s on
          # macOS, 14m11s on Linux. That was not a cold first run that would
          # warm itself up. It was the steady state.
          #
          # So the caches these jobs restore are written on `main`, by the
          # `size` workflow, under this same shared key. `shared-key` is what
          # makes the keys match at all: without it rust-cache derives the key
          # from the job id, so `bundle` could not restore what `size` saved
          # even on the same ref and the same OS.
          shared-key: release
          # And nothing is written back, because a tag-scoped cache has no
          # reader — not even a re-run of this tag, which restores from `main`
          # like any other run. Saving one costs ~45s per job and 2.8 GB of the
          # repository's 10 GB cache budget, evicting the caches on `main` that
          # are the ones actually being read.
          save-if: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # Tauri does not vendor a webview on Linux — it links the system
        # WebKitGTK — and the AppImage bundler shells out to patchelf and
        # xdg-utils. Absent any of these the bundle step fails at link or at
        # package time, not at `cargo check`.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf xdg-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundler builds an installer but no signature,
          # and the manifest is written with an empty one that no client will
          # accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # Upload into the draft the `draft` job opened, rather than creating
          # one. This is what makes running the three platforms at once safe.
          releaseId: ${{ needs.draft.outputs.id }}
          # The one write that could not be parallel. `publish` composes the
          # manifest from the .sig files instead — see
          # scripts/compose-latest-json.mjs, which reproduces byte-for-byte
          # what this action emitted for v0.1.2.
          includeUpdaterJson: false

  publish:
    name: compose latest.json and publish
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # One writer, after every platform has landed its signatures. The
        # script fails the job if any platform an installed copy actually looks
        # up is missing from the manifest, which turns the old silent failure —
        # an OS that stops being offered updates and says nothing — into a red
        # run.
        run: |
          node scripts/compose-latest-json.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"

      - name: Flip the draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Looked up by listing rather than by `releases/tags/<tag>`, because
        # that endpoint 404s on drafts. `make_latest` is set explicitly: it is
        # what makes `releases/latest/download/latest.json` — the updater's
        # only endpoint — resolve here.
        run: |
          set -eu
          TAG="$GITHUB_REF_NAME"
          ID=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::no release found for tag $TAG"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$ID" -F draft=false -f make_latest=true
