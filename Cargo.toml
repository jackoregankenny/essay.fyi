[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

# Release settings, because the defaults are wrong for this shape of binary.
#
# Essay links one very large dependency — the Typst compiler — into every
# artifact, and cargo's stock release profile leaves it in sixteen codegen
# units with no cross-crate inlining or dead-code elimination between them.
#
# The comment here used to say fat LTO was the price of a small binary and
# that `lto = "thin"` was the escape hatch if build time ever became the
# bottleneck. It became the bottleneck, so the escape hatch was measured
# rather than assumed. All four corners, cold, x86_64-pc-windows-msvc,
# rustc 1.97.1, 16 cores, same commit — time, then essay-desktop.exe:
#
#   fat  + codegen-units=1    17m20s   53,111,296     <- what shipped before
#   fat  + codegen-units=16   15m16s   56,108,544
#   thin + codegen-units=16    7m34s   60,350,976
#   thin + codegen-units=1     8m17s   55,190,528     <- what ships now
#
# Two things fell out of that, and neither was the guess.
#
# `codegen-units` is not the cheap half. Going 1 -> 16 under fat LTO bought
# back 12% of the build and cost 5.6% of the binary, which is a bad trade and
# fails the size budget outright. The intuition that whole-program LTO makes
# per-crate codegen units irrelevant to size is simply wrong here, so it stays
# at 1 — and staying at 1 is what keeps thin LTO's cost down to 3.9%.
#
# `lto` is where the time actually was. Thin at codegen-units=1 halves the
# cold build for 2.03 MB of binary, which after the installer's ~3.4x
# compression is roughly 0.6 MB of download. Fat LTO optimises the whole
# program as a single serial unit and cannot start until every crate has
# compiled; thin partitions that work and runs it across cores. The gap will
# be narrower on a 4-core runner than it is on the 16-core machine measured
# above, but it does not close: the serial link is slow at any core count.
#
# scripts/size-budget.json was rebaselined against the thin numbers when this
# landed. That is the real cost of this decision — not the megabytes, but that
# the tripwire had to be moved, so a regression is now measured from a higher
# floor.
#
# `strip` earns nothing on the MSVC target, where symbols live in a separate
# PDB; it is here for the GNU, macOS and Linux targets, where they do not.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dev debuginfo, because the stock dev profile is also wrong for this shape of
# binary. Cargo never garbage-collects target/: a dep bump, a feature flip or a
# toolchain update changes a crate's metadata hash and the old artifacts are
# kept forever against the chance you switch back. With Typst linked into every
# artifact and MSVC writing debug symbols to a separate PDB per hash, that is
# half a gigabyte per stale configuration. Measured: eight live essay-render
# PDBs of ~500 MB over two weeks, 6.61 GB of artifacts for that one crate.
#
# `line-tables-only` keeps backtraces with file and line for our own code and
# drops the rest. Dependencies get nothing — we do not step through Typst.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "2"
markdown = "1"
blake3 = "1"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }

essay-context = { path = "crates/essay-context" }
essay-core = { path = "crates/essay-core" }
essay-markdown = { path = "crates/essay-markdown" }
essay-revisions = { path = "crates/essay-revisions" }
essay-diff = { path = "crates/essay-diff" }
essay-render = { path = "crates/essay-render" }
essay-workspace = { path = "crates/essay-workspace" }
essay-agents = { path = "crates/essay-agents" }
essay-search = { path = "crates/essay-search" }
