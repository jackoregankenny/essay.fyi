[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

# Release settings, because the defaults are wrong for this shape of binary.
#
# Essay links one very large dependency — the Typst compiler — into every
# artifact, and cargo's stock release profile leaves it in sixteen codegen
# units with no cross-crate inlining or dead-code elimination between them.
# Measured on essay-desktop: 64.38 MB stock, 58.96 MB with these settings.
#
# The cost is build time, and it is not small: a cold release build roughly
# doubles, because fat LTO cannot start until every crate has compiled and
# then optimises the lot as one unit. That is paid by the `size` job and the
# release workflow, which already cache aggressively, and never by `cargo
# check`, `cargo test` or `tauri dev` — none of which use this profile. If it
# ever becomes the bottleneck, `lto = "thin"` keeps most of the saving for a
# fraction of the link time.
#
# `strip` earns nothing on the MSVC target, where symbols live in a separate
# PDB; it is here for the GNU, macOS and Linux targets, where they do not.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Dev debuginfo, because the stock dev profile is also wrong for this shape of
# binary. Cargo never garbage-collects target/: a dep bump, a feature flip or a
# toolchain update changes a crate's metadata hash and the old artifacts are
# kept forever against the chance you switch back. With Typst linked into every
# artifact and MSVC writing debug symbols to a separate PDB per hash, that is
# half a gigabyte per stale configuration. Measured: eight live essay-render
# PDBs of ~500 MB over two weeks, 6.61 GB of artifacts for that one crate.
#
# `line-tables-only` keeps backtraces with file and line for our own code and
# drops the rest. Dependencies get nothing — we do not step through Typst.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "2"
markdown = "1"
blake3 = "1"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }

essay-context = { path = "crates/essay-context" }
essay-core = { path = "crates/essay-core" }
essay-markdown = { path = "crates/essay-markdown" }
essay-revisions = { path = "crates/essay-revisions" }
essay-diff = { path = "crates/essay-diff" }
essay-render = { path = "crates/essay-render" }
essay-workspace = { path = "crates/essay-workspace" }
essay-agents = { path = "crates/essay-agents" }
essay-search = { path = "crates/essay-search" }
