[package]
name = "essay-desktop"
description = "Essay — desktop application shell"
authors = ["Jack O'Regan Kenny"]
edition = "2021"
rust-version = "1.77.2"
version.workspace = true
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
essay-agents.workspace = true
essay-diff.workspace = true
essay-markdown.workspace = true
essay-render.workspace = true
essay-revisions.workspace = true
essay-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

# Auto-update: the updater downloads and installs signed releases, and
# `process` is what a "Restart to update" button relaunches through. Desktop
# only — there is no such thing as sideloading an update on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
