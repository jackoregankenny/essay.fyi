[package]
name = "essay-render"
description = "Typst compilation pipeline: Markdown index -> Typst -> PDF/pages"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The system font database. Essay does not embed fonts: `typst-assets`'
# `fonts` feature is an all-or-nothing 9.23 MB of Libertinus, New Computer
# Modern and DejaVu, and no crate in the Typst tree turns it on but us — so
# leaving it off is what keeps those megabytes out of every artifact. What
# the compiler typesets with instead is whatever this machine has installed;
# see `world.rs` and the font stack in `templates/essay/essay.typ`.
fontdb = "0.23"
markdown.workspace = true
# Only for the font-management types, which cross to the WebView as-is rather
# than being restated in the shell.
serde.workspace = true
thiserror.workspace = true
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
# Optional: the raster (tiny-skia) stack behind `render_png_page`. PNG only
# serves the CLI's `--format png` eyeballing path and tests, never the
# desktop app (live preview is SVG, export is PDF) — keep it out of the
# default feature set so the desktop binary doesn't carry it.
typst-render = { version = "0.15.1", optional = true }
typst-svg = "0.15.1"

[features]
png = ["dep:typst-render"]
