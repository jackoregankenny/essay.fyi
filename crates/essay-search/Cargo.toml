[package]
name = "essay-search"
description = "Project and document search"
version.workspace = true
edition.workspace = true
license.workspace = true

# No index, no regex engine, no walker crate: a straight scan over files the
# shell already knows how to enumerate. See the crate doc comment for why a
# forty-page manuscript does not need any of them.
[dependencies]
serde.workspace = true

[dev-dependencies]
tempfile = "3"
